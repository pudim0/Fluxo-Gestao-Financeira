<section class="notifications-page">
  <div class="notifications-panel">
    <header class="notifications-header">
      <div class="notifications-title-wrap">
        <h1>Notificações</h1>
        <p>4 não lidas</p>
      </div>

      <button type="button" class="mark-all">Marcar todas com lidas</button>
    </header>

    <div class="summary-grid" aria-label="Resumo de notificações">
      @for (summary of summaries; track summary.label) {
        <button type="button" class="summary-card" [class.is-active]="summary.label === activeSummary" [class.is-danger]="summary.tone === 'danger'" [class.is-warning]="summary.tone === 'warning'" [class.is-success]="summary.tone === 'success'" [class.is-info]="summary.tone === 'info'">
          <span class="summary-label">{{ summary.label }}</span>
          <span class="summary-value">{{ summary.count }}</span>
        </button>
      }
    </div>

    <div class="feed-shell" aria-live="polite">
      <div class="feed-tabs" role="tablist" aria-label="Filtros de notificações">
        <button type="button" class="feed-tab is-active">Todas <span>4</span></button>
        <button type="button" class="feed-tab">Alertas <span>1</span></button>
        <button type="button" class="feed-tab">Lembretes <span>1</span></button>
        <button type="button" class="feed-tab">Transações <span>1</span></button>
        <button type="button" class="feed-tab">Metas <span>1</span></button>
      </div>

      <div class="feed-group">
        <div class="feed-date">HOJE</div>

        @for (item of notifications; track item.id) {
          <article class="notification-item">
            <div class="notification-icon" [class]="item.tone">
              <span aria-hidden="true">{{ item.icon }}</span>
            </div>

            <div class="notification-body">
              <div class="notification-title-row">
                <h2>{{ item.title }}</h2>
                <span class="notification-category">{{ item.category }}</span>
                <span class="notification-dot" aria-hidden="true"></span>
              </div>

              <p class="notification-message">{{ item.message }}</p>

              <div class="notification-footer">
                <span>há {{ item.elapsed }}</span>
                <strong [class.amount-positive]="item.amountTone === 'positive'" [class.amount-negative]="item.amountTone === 'negative'">
                  {{ item.amount }}
                </strong>
              </div>
            </div>
          </article>
        }
      </div>
    </div>
  </div>
</section>
