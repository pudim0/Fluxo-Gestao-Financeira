<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluso Dashboard</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Inclusão da biblioteca Lucide via CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="style.css" />

    <script src="code.js" defer></script>
  </head>
  <body>
    <div class="fluso">
      <!-- BARRA LATERAL -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <div class="brand-icon">
              <!-- Ícone Lucide (Raio) -->
              <i data-lucide="zap"></i>
            </div>
            <div class="brand-name">Flu<span>$</span>o</div>
          </div>
        </div>

        <!-- MENU DE NAVEGAÇÃO -->
        <nav class="sidebar-nav">
          <!-- O item com a classe 'active' representa a página atual -->
          <a href="#" class="nav-item active">
            <i data-lucide="layout-dashboard"></i>
            <span>Dashboard</span>
          </a>
          <a href="#" class="nav-item">
            <i data-lucide="users"></i>
            <span>Usuários</span>
          </a>
          <a href="#" class="nav-item">
            <i data-lucide="trending-up"></i>
            <span>Investimentos</span>
          </a>
          <a href="#" class="nav-item">
            <i data-lucide="target"></i>
            <span>Metas</span>
          </a>
          <a href="#" class="nav-item">
            <i data-lucide="bell"></i>
            <span>Alertas</span>
          </a>
          <a href="#" class="nav-item">
            <i data-lucide="settings"></i>
            <span>Configurações</span>
          </a>
        </nav>
      </aside>

      <!-- ÁREA PRINCIPAL -->
      <main>
        <!-- CABEÇALHO -->
        <header class="topbar">
          <div class="header-left">
            <button class="hamburger">
              <i data-lucide="menu"></i>
            </button>
          </div>
          <div class="header-inner">
            <div class="logo">
              <h1 class="logo-title">`Olá, ${Usuário}`</h1>
            </div>

            <div class="notificacao">
              <button class="notificacao-botao" aria-label="Ver notificações">
                <!-- Ícone Lucide (Sino) -->
                <i data-lucide="bell"></i>
              </button>
            </div>
          </div>
        </header>

        <!-- CONTEÚDO -->
        <section style="padding: 32px">
          <h2>Bem-vindo ao sistema</h2>
          <p></p>
        </section>
      </main>
    </div>

    <!-- Script para renderizar os ícones da Lucide -->
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
